<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facteur · Le mot du jour</title>
    <meta name="description" content="Le défi Mot du jour de Facteur. Six essais pour trouver le mot.">

    <!-- Open Graph statique. Limite assumée : les crawlers n'exécutent pas le JS,
         la preview ne peut donc pas afficher le score du partage. -->
    <meta property="og:site_name" content="Facteur">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Le mot du jour">
    <meta property="og:description" content="Six essais pour trouver le mot du jour. Un défi par jour, dans Facteur.">
    <meta property="og:url" content="https://facteur.app/grille">
    <!-- Pas d'og:image : aucun visuel 1200x630 de marque n'existe encore
         (cf. story partage.1). `summary` rend une carte texte propre ;
         basculer sur `summary_large_image` le jour où l'asset arrive. -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Le mot du jour">
    <meta name="twitter:description" content="Six essais pour trouver le mot du jour. Un défi par jour, dans Facteur.">

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/style.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .grille-redirect {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }
        .grille-redirect__emoji {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        .grille-redirect__title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
        }
        .grille-redirect__subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            max-width: 360px;
        }
        .grille-redirect__btn {
            display: inline-block;
            background: #111;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.9rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 1rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .grille-redirect__btn:hover {
            background: #333;
        }
        .grille-redirect__stores {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .grille-redirect__stores a {
            font-size: 0.95rem;
            color: #0a58ca;
            text-decoration: underline;
        }
        .grille-redirect__status {
            font-size: 0.9rem;
            color: #999;
            margin-top: 1.5rem;
        }
    </style>
</head>

<body>
    <header class="section hero legal-page__hero" style="min-height: auto; padding: 2rem 0 1rem;">
        <div class="container">
            <a href="/" class="section-nav__item" style="font-size:0.9rem;">Facteur</a>
        </div>
    </header>

    <main>
        <div class="grille-redirect">
            <div class="grille-redirect__emoji">🔡</div>
            <h1 class="grille-redirect__title" id="title">Le mot du jour</h1>
            <p class="grille-redirect__subtitle" id="subtitle">Six essais pour trouver le mot du jour.</p>

            <button class="grille-redirect__btn" id="open-btn" type="button">
                Ouvrir dans Facteur
            </button>

            <div class="grille-redirect__stores" id="stores">
                <p style="font-size:0.9rem; color:#555; margin:0">Facteur n'est pas installé ?</p>
                <a href="#" id="ios-link" data-store="ios">Télécharger sur l'App Store</a>
                <a href="#" id="android-link" data-store="android">Télécharger sur Google Play</a>
            </div>

            <p class="grille-redirect__status" id="status"></p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var DEEP_LINK = 'io.supabase.facteur://grille';
            var SURFACE = 'grille_defi';
            var APP_STORE_ID = '6778094299';
            var PLAY_PACKAGE = 'facteur.app';
            var ATTRIB_KEY = 'facteur_attrib_v1';
            var ATTRIB_TTL_MS = 30 * 24 * 60 * 60 * 1000;

            var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            var ANDROID = /android/i.test(navigator.userAgent);
            var MOBILE = IOS || ANDROID;

            var params = new URLSearchParams(window.location.search);

            // Les trois params du lien de défi. Chacun est re-validé côté client :
            // tout ce qui arrive de l'URL est hostile par défaut.
            var numero = (params.get('n') || '').replace(/\D/g, '').slice(0, 6);
            var rawScore = params.get('s') || '';
            var score = /^\d{1,2}\/\d{1,2}$/.test(rawScore) ? rawScore : '';
            var rawRef = params.get('ref') || '';
            var ref = /^[A-Za-z0-9_-]{1,32}$/.test(rawRef) ? rawRef : '';

            // --- Titre porteur d'état -----------------------------------------
            // textContent et jamais innerHTML : `numero`/`score` viennent de l'URL.
            if (score && numero) {
                document.getElementById('title').textContent =
                    'Quelqu’un a fait ' + score + ' au Mot du jour N°' + numero;
                document.getElementById('subtitle').textContent = 'À toi d’essayer.';
            } else if (numero) {
                document.getElementById('title').textContent =
                    'Le Mot du jour N°' + numero;
            }

            // --- Attribution ---------------------------------------------------
            function utmQuery() {
                var q = 'utm_source=app&utm_medium=partage_in_app&utm_content=' + SURFACE;
                return ref ? q + '&ref=' + ref : q;
            }

            // Filet 30 j : si l'installation passe par un store sans propager le
            // referrer (iOS notamment), l'app pourra encore lire l'attribution
            // depuis le navigateur au premier retour sur le web.
            function persistAttribution() {
                if (!ref) return;
                try {
                    window.localStorage.setItem(ATTRIB_KEY, JSON.stringify({
                        ref: ref,
                        utm_source: 'app',
                        utm_medium: 'partage_in_app',
                        utm_content: SURFACE,
                        expires_at: Date.now() + ATTRIB_TTL_MS
                    }));
                } catch (e) { /* mode privé, quota : l'attribution est best-effort */ }
            }

            var campaign = ref ? 'partage_grille_' + ref : 'partage_grille';
            document.getElementById('ios-link').href =
                'https://apps.apple.com/us/app/facteur-ton-algo-ton-info/id' + APP_STORE_ID +
                '?ct=' + encodeURIComponent(campaign) + '&mt=8';
            document.getElementById('android-link').href =
                'https://play.google.com/store/apps/details?id=' + PLAY_PACKAGE + '&hl=fr' +
                '&referrer=' + encodeURIComponent(utmQuery());

            // --- Ouverture de l'app --------------------------------------------
            var stores = document.getElementById('stores');

            function revealStores(message) {
                stores.style.display = 'flex';
                document.getElementById('status').textContent = message || '';
                document.getElementById('open-btn').disabled = false;
                if (IOS) { document.getElementById('android-link').style.display = 'none'; }
                else if (ANDROID) { document.getElementById('ios-link').style.display = 'none'; }
            }

            // Scheme custom volontaire (pas l'universal link) : une fois cette page
            // affichée, iOS court-circuite l'universal link pour un tap sur le même
            // domaine. L'universal link joue en amont, et la page n'est alors jamais
            // rendue.
            function tryOpen() {
                document.getElementById('open-btn').disabled = true;
                document.getElementById('status').textContent = 'Ouverture de Facteur…';
                window.location.href = DEEP_LINK;
                setTimeout(function () {
                    revealStores('L’app ne s’est pas ouverte automatiquement.');
                }, 1500);
            }

            document.getElementById('open-btn').addEventListener('click', tryOpen);

            Array.prototype.forEach.call(stores.querySelectorAll('a[data-store]'), function (a) {
                a.addEventListener('click', function () {
                    if (window.gtag) {
                        window.gtag('event', 'store_click', {
                            store: a.getAttribute('data-store'), surface: SURFACE, ref: ref
                        });
                    }
                });
            });

            persistAttribution();

            // Sur desktop, le scheme custom ne mène nulle part : proposer
            // directement les stores plutôt que déclencher un échec de navigation.
            if (MOBILE) { tryOpen(); } else { revealStores(); }
        })();
    </script>
    <script src="/js/consent.js?v=1"></script>
</body>

</html>
