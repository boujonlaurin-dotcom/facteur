name: Mobile Tests

# Pourquoi ce workflow existe.
#
# Jusqu'ici AUCUN test Dart ne gardait une release : `ci-tests.yml` ne lance que
# `pytest` sur `packages/api/**`, et `build-apk.yml` / `build-aab.yml` compilent
# sans jamais lancer `flutter test` ni `flutter analyze`. Les tests du widget
# d'accueil écrits lors des itérations précédentes existaient donc bel et bien,
# mais n'étaient exécutés qu'à la main — d'où un widget cassé à répétition, à
# chaque release, sans que rien ne rougisse. Cf.
# docs/bugs/bug-widget-flaner-android.md (D8).

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-tests.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  widget-guard:
    name: Analyze + tests widget d'accueil
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      # Version **épinglée**, alignée sur `build-apk.yml` — la toolchain qui
      # produit réellement l'app. Un `channel: stable` nu a tiré un Flutter plus
      # récent où `IconData` est `final` : `phosphor_flutter` 2.1.0 ne compile
      # plus, et TOUT fichier de test qui touche à l'arbre de widgets échoue à
      # la compilation. Deux des trois échecs du premier run venaient de là —
      # pas du code testé. Un gate sur une toolchain différente de celle qui
      # build teste autre chose que ce qu'on livre.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Ce job gate sur les **erreurs** d'analyse, rien d'autre.
      #
      # `--no-fatal-infos` seul ne suffit pas : les *warnings* restent fatals
      # par défaut, et le repo en porte des centaines de pré-existants
      # (`inference_failure_on_function_invocation` sur les box Hive, imports
      # inutilisés dans les tests…). Sans `--no-fatal-warnings`, ce job échoue
      # sur du code que la PR ne touche pas — c'est exactement ce qui a rougi
      # au premier run (535 issues, 0 erreur). Un gate qui crie sur du bruit
      # pré-existant finit désactivé ; on garde donc ce qui casse vraiment un
      # build, et ce sont les tests ci-dessous qui portent la vraie exigence.
      - name: Flutter analyze (erreurs uniquement)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Périmètre ciblé, et assumé comme tel : la suite mobile complète porte
      # ~27 échecs pré-existants (cf. mémoire projet). Un gate global serait
      # rouge dès le premier jour, donc désactivé dans la semaine — un gate
      # étroit et vert est ce qui protège réellement. Élargir ce paquet au fur
      # et à mesure que la dette est résorbée.
      #
      # `if: always()` : une analyse en échec ne doit pas masquer le résultat
      # des tests. Les deux étapes rendent compte, le job échoue si l'une des
      # deux échoue.
      - name: Tests du widget d'accueil
        if: ${{ !cancelled() }}
        run: |
          flutter test \
            test/core/services/widget_service_test.dart \
            test/core/services/deep_link_service_test.dart \
            test/features/feed/feed_provider_widget_refresh_test.dart \
            test/android/widget_resources_test.dart

      # Élargissement du paquet (cf. commentaire ci-dessus) : composition de la
      # Tournée. C'est le code qui décide quels blocs de L'Essentiel sont rendus
      # et dans quel ordre — un bloc favori qui disparaît en silence est invisible
      # en analyse statique et n'a aucun autre garde-fou automatisé.
      - name: Tests de composition de la Tournée
        if: ${{ !cancelled() }}
        run: |
          flutter test \
            test/features/flux_continu/providers/flux_continu_tournee_order_test.dart \
            test/features/flux_continu/providers/flux_continu_block_score_order_test.dart \
            test/features/flux_continu/utils/section_score_order_test.dart
      # Élargissement du paquet (cf. commentaire ci-dessus) : le dossier auth
      # est vert en entier et garde l'entrée dans l'app — inscription,
      # connexion, SSO Apple. Le SSO Apple est resté cassé en prod jusqu'à ce
      # qu'un utilisateur envoie une capture d'écran
      # (docs/bugs/bug-apple-sso-provider-not-enabled.md) ; c'est précisément le
      # genre de chemin qui mérite un gate.
      - name: Tests d'authentification
        if: ${{ !cancelled() }}
        run: flutter test test/features/auth/
