name: Build Android APK (beta)

# Env CONTINU : chaque merge sur main builde le flavor `beta`
# (com.example.facteur.beta, side-loaded GitHub Releases, UPDATE_CHANNEL=beta)
# consommé par l'app de test interne.
# Les vrais users passent par weekly-release.yml (flavor beta, UPDATE_CHANNEL=stable).
on:
  push:
    # `main` = canal beta des testeurs. La 2ᵉ branche est un **build de review**
    # d'une branche en cours : il ne produit QUE l'artefact (la publication de
    # release est verrouillée sur `main`, cf. l'étape « Create Beta Release »),
    # donc aucun testeur ne reçoit un APK d'une branche non mergée.
    branches: [ main, claude/article-section-navigation-d0y3yk ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL API (défaut: staging)'
        required: true
        default: 'https://api-staging-40d3.up.railway.app/api'
      create_release:
        description: 'Créer une release beta pour les testeurs'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Nécessaire pour créer des releases
    steps:
      - uses: actions/checkout@v4

      - name: Verify google-services.json (beta)
        uses: ./.github/actions/verify-google-services
        with:
          flavor: beta

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/android/app/facteur-release.jks

      - name: Create key.properties
        run: |
          cat > apps/mobile/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=facteur-release.jks
          EOF

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Generate icons
        run: |
          cd apps/mobile
          flutter pub run flutter_launcher_icons

      # Generate version tag BEFORE build so it can be injected into the APK.
      # Le préfixe distingue le canal : `beta-` (main, servi aux testeurs par
      # l'updater in-app) vs `review-` (branche en cours). Le backend ne sert
      # QUE les tags `beta-` et `release-` (cf. `app_update.py`), donc un build
      # de review reste invisible pour tout le monde sauf celui qui a le lien.
      - name: Generate version
        id: version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "version=beta-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          else
            echo "version=review-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Build APK (beta flavor — side-loaded GitHub Releases)
        run: |
          cd apps/mobile
          flutter build apk --release --flavor beta \
            --build-number=${{ github.run_number }} \
            --dart-define="API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api-staging-40d3.up.railway.app/api' }}" \
            --dart-define="SUPABASE_URL=${{ secrets.SUPABASE_URL }}" \
            --dart-define="SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define="REVENUECAT_IOS_KEY=${{ secrets.REVENUECAT_IOS_KEY }}" \
            --dart-define="POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" \
            --dart-define="POSTHOG_HOST=${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}" \
            --dart-define="SENTRY_DSN=${{ secrets.SENTRY_DSN_FLUTTER }}" \
            --dart-define="SENTRY_ENVIRONMENT=staging" \
            --dart-define="UPDATE_CHANNEL=beta" \
            --dart-define="APP_RELEASE_TAG=${{ steps.version.outputs.version }}"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: facteur-app-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-beta-release.apk

      - name: Rename APK
        run: |
          mv apps/mobile/build/app/outputs/flutter-apk/app-beta-release.apk \
             apps/mobile/build/app/outputs/flutter-apk/Facteur-${{ steps.version.outputs.version }}.apk

      # Build de review : release téléchargeable en un clic (l'artefact d'Actions
      # demande d'être connecté et livre un zip). Tag `review-…` → hors des deux
      # canaux de l'updater.
      - name: Publish review build
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Review — ${{ github.ref_name }}"
          body: |
            Build de review de la branche `${{ github.ref_name }}`.

            - Commit : ${{ github.sha }}
            - Flavor `beta`, API staging.
            - Tag `review-…` : **hors des canaux de mise à jour**. L'updater
              in-app ne lit que `beta-` et `release-`, personne ne reçoit ce
              build sans ce lien.

            Telecharge le `.apk` ci-dessous, ouvre-le sur ton Android, autorise
            l'installation depuis une source inconnue si demande.
          files: apps/mobile/build/app/outputs/flutter-apk/Facteur-${{ steps.version.outputs.version }}.apk
          prerelease: true

      - name: Create Beta Release
        # Jamais depuis une branche de review : le canal beta ne sert que ce qui
        # est passé par `main`.
        if: github.event.inputs.create_release != 'false' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Facteur Beta - ${{ steps.version.outputs.version }}"
          body: |
            ## Telecharger l'APK

            **Clique sur le fichier `.apk` ci-dessous pour telecharger l'application.**

            ### Installation sur Android
            1. Telecharge le fichier `.apk` sur ton telephone
            2. Ouvre le fichier telecharge
            3. Si demande, autorise l'installation d'apps inconnues
            4. Installe l'application

            **Ou depuis l'app**: si tu as deja une version installee, appuie sur l'icone de mise a jour en haut a droite du digest.

            ---
            Build: ${{ steps.version.outputs.version }}
            Commit: ${{ github.sha }}
          files: apps/mobile/build/app/outputs/flutter-apk/Facteur-${{ steps.version.outputs.version }}.apk
          prerelease: true
          generate_release_notes: true
