  # ── Groupe C : piège à faux positifs ──────────────────────────────────────
  # Média entièrement gratuit qui parle d'abonnements, de presse et de
  # financement des médias. C'est le seul endroit du corpus où un mot-clé trop
  # court ("abonnés", "premium", "s'abonner" en pied de page) se trahit. Tout
  # mot-clé candidat au DEFAULT_PAYWALL_CONFIG doit être testé ici en premier.

  - slug: contrepoints
    name: Contrepoints
    group: false_positive_trap
    feed_candidates:
